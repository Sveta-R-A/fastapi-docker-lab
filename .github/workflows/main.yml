
name: FastAPI CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff formatting
        run: ruff format --check .

  test:
    name: Run Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run API tests
        run: python -m pytest -v --cov=app --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security:
    name: Security Checks
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Bandit
        run: bandit -r app -ll

      - name: Run pip-audit
        run: pip-audit -r requirements.txt

  build:
    name: Build Docker Image
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: local/fastapi-ci:scan
          outputs: type=docker,dest=/tmp/fastapi-image.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/fastapi-image.tar

  scan:
    name: Scan Docker Image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/fastapi-image.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: local/fastapi-ci:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  publish:
    name: Publish Docker Image
    needs: scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/fastapi-image.tar

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        run: docker tag local/fastapi-ci:scan "$IMAGE_NAME:sha-${GITHUB_SHA}"

      - name: Push Docker image
        run: docker push "$IMAGE_NAME:sha-${GITHUB_SHA}"

 
  deploy:
    name: Deploy to Google Cloud Run
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      service_url: ${{ steps.get-url.outputs.service_url }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ vars.GCP_SERVICE }}" \
            --image "ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --platform managed \
            --allow-unauthenticated

      - name: Get Cloud Run URL
        id: get-url
        run: |
          SERVICE_URL=$(gcloud run services describe "${{ vars.GCP_SERVICE }}" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --format="value(status.url)")
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
          echo "Cloud Run URL: $SERVICE_URL"

  smoke:
    name: Smoke Test Deployed API
    needs: deploy
    runs-on: ubuntu-latest
    env:
      SERVICE_URL: ${{ needs.deploy.outputs.service_url }}
    steps:
      - name: Check API health and documentation
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          import urllib.error

          base_url = os.environ["SERVICE_URL"].rstrip("/")

          def check_endpoint(path, expected_status=200):
              url = base_url + path
              last_error = None

              for attempt in range(5):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={"User-Agent": "GitHub-Actions-Smoke-Test"}
                      )
                      with urllib.request.urlopen(request, timeout=20) as response:
                          body = response.read().decode("utf-8")
                          if response.status != expected_status:
                              raise RuntimeError(
                                  f"{path}: expected HTTP {expected_status}, "
                                  f"got {response.status}"
                              )
                          return body
                  except Exception as error:
                      last_error = error
                      print(f"Attempt {attempt + 1}/5 failed: {error}")
                      if attempt < 4:
                          time.sleep(3)

              raise RuntimeError(f"{path} failed: {last_error}")

          health_body = check_endpoint("/health")
          health_data = json.loads(health_body)

          if health_data.get("status") != "ok":
              raise RuntimeError(
                  f"Unexpected health status: {health_data}"
              )

          print(f"Health check passed: {health_data}")

          check_endpoint("/docs")
          print("Swagger documentation check passed")
          PY

